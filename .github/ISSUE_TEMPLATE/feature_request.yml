name: Feature Request
description: Suggest an improvement to the pipeline or tooling
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap in the current pipeline or UX friction you're experiencing.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Phase logic (profile/audit/confirm/assess/draft_ghsa/disclose/verify)
        - hd_scan (dependency/secret/supply-chain scanning)
        - Provider support
        - CLI (hd-run / hd-ci)
        - MCP protocol / server
        - Documentation
        - CI/CD integration
        - Other
    validations:
      required: true
